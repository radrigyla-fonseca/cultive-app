<ion-tab-bar slot="bottom" class="floating-tab-bar">
  <ion-tab-button (click)="navigateTo('home')" [class.tab-selected]="activePage === 'home'">
    <ion-icon name="home"></ion-icon>
    <ion-label>HOME</ion-label>
  </ion-tab-button>

  <ion-tab-button (click)="navigateTo('estufas')" [class.tab-selected]="activePage === 'estufas'">
    <ion-icon name="leaf"></ion-icon>
    <ion-label>ESTUFAS</ion-label>
  </ion-tab-button>

  <ion-tab-button (click)="navigateTo('relatorios')" [class.tab-selected]="activePage === 'relatorios'">
    <ion-icon name="bar-chart"></ion-icon>
    <ion-label>RELATÓRIOS</ion-label>
  </ion-tab-button>

  <ion-tab-button (click)="navigateTo('config')" [class.tab-selected]="activePage === 'config'">
    <ion-icon name="settings"></ion-icon>
    <ion-label>CONFIG</ion-label>
  </ion-tab-button>
</ion-tab-bar>
