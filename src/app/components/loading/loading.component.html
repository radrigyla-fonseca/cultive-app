<section class="loading-screen" role="status" aria-live="polite" aria-atomic="true">
  <!-- <div class="eyebrow">Monitoramento inteligente</div> -->

  <div class="scene" aria-hidden="true">
    <div class="orbit orbit-primary"></div>
    <div class="orbit orbit-secondary"></div>

    <div class="logo-wrap">
      <img src="./images/cultive-icon.svg" alt="cultive logo" />
    </div>

    <span class="sensor sensor-one"></span>
    <span class="sensor sensor-two"></span>
    <span class="sensor sensor-three"></span>
  </div>

  <h1>{{ title }}<span class="title-dot">.</span></h1>
  <p class="subtitle">{{ subtitle }}</p>

  <div class="status-line">
    <span class="pulse-dot"></span>
    <span class="status-message">{{ currentMessage }}</span>
  </div>

  <div class="footer">{{ footer }}</div>
</section>
