<div class="water-tracker-div">
    <ion-grid>
        <ion-row>
            <ion-col size="auto" class="reservoir-percentage">
                <div class="water-level-div">
                    <p class="water-percentage">{{ waterLevel }}%</p>
                </div>
            </ion-col>
            <ion-col>
                <div class="progress-bar-wrapper">
                    <ion-progress-bar [value]="waterLevelPercentage"></ion-progress-bar>
                </div>
            </ion-col>
        </ion-row>
    </ion-grid>
</div>
