<ion-card [class]="conditionClass">
    <ion-icon [name]="icon"></ion-icon>
    <div class="ion-align-content-between">
        <ion-card-header>
            <ion-card-title> {{ title }} </ion-card-title>
            <ion-card-subtitle>{{ min }} {{ unit }} - {{ max }} {{ unit }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
            <p class="variable-value">
            {{ value }}
            <span class="unit">{{ unit }}</span>
            </p>
            <p class="condition">{{ condition }}</p>
        </ion-card-content>
    </div>
</ion-card>
