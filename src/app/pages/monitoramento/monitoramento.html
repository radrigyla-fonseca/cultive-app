<app-header 
  [logo] = false
  [goBack]=true
  [pageTitle]="'Monitoramento'"
></app-header>

<ion-content fullscreen="true">
  <div 
    class="mood-color"
    [class.great]="moodStatus === 'great'"
    [class.alert]="moodStatus === 'alert'"
    [class.stressed]="moodStatus === 'stressed'"
  ></div>
  <div id="container" class="ion-padding">
    <!-- Mood Tracker -->
    <div class="mood-tracker-content">
      <app-mood-tracker 
        [progress]="moodLevel"
        [status]="moodStatus"
      ></app-mood-tracker>
      <div class="mood-tracker-text">
        <h1 
          class="mood-title"
          [class]="moodStatus"
        >{{ moodTitle }}</h1>
        <p class="mood-description">
          {{ moodDescription }}
        </p>
        <ion-chip
          [outline]="true"
          [class.great]="moodStatus === 'great'"
          [class.alert]="moodStatus === 'alert'"
          [class.stressed]="moodStatus === 'stressed'"
        >
          <ion-icon [name]="moodIcon"></ion-icon>
          <ion-label>
            {{ moodChipText }}
          </ion-label>
        </ion-chip>
      </div>
    </div>
    
    @if(dataArr.length) {
      <!-- Reservatório -->
      <div class="section-content">
        <div class="section-text">
          <ion-icon id="reservoir" name="water"></ion-icon>
          <h2 class="section-title">Reservatório</h2>
        </div>
        <app-water-tracker
          [waterLevel] = "waterLevel"
        ></app-water-tracker>
      </div>
      <!-- Condições atuais -->
      <div class="section-content">
        <div class="section-text">
          <ion-icon id="conditions" name="pulse"></ion-icon>
          <h2 class="section-title">Condições</h2>
        </div>
        <ion-grid>
          <ion-row class="section-cards ion-align-items-stretch">
            <!-- Temperatura -->  
            @for (item of dataArr; track item.title) {
              <ion-col size="12" size-md="6" size-lg="3">
                <app-variable-card
                  [title]="item.title"
                  [icon]="item.icon"
                  [min]="item.min"
                  [max]="item.max"
                  [value]="item.value"
                  [unit]="item.unit"
                  [condition]="item.condition"
                  [conditionClass]="item.conditionClass"
                ></app-variable-card>
              </ion-col>
            }
          </ion-row>
        </ion-grid>
      </div>
    }
    <!-- Barra de navegação -->
    <!-- <app-bottom-nav [activePage]="'monitoramento'"></app-bottom-nav> -->
  </div>
</ion-content>
