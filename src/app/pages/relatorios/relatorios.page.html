<app-header [pageTitle]="'Relatórios'"></app-header>

<ion-content [fullscreen]="true">
  <div id="container" class="ion-padding">
    <div class="section-content">

      <div class="section-text">
        <ion-icon id="list" name="calendar"></ion-icon>
        <h2 class="section-title">Esse mês</h2>
      </div>
      
      <div class="period-div">
        <div class="relatorio-div">
          <h2 class="relatorio-title">Hoje, 10 Nov</h2>

          <ion-card>
            <ion-card-header>
              <ion-card-title>Relatório semanal</ion-card-title>
              <ion-card-subtitle>10/10/26 | 18:50</ion-card-subtitle>
            </ion-card-header>
            <ion-card-content>
              <div class="highlight">
                <apx-chart
                  [series]="series()"
                  [chart]="chart"
                  [xaxis]="xaxis"
                  [title]="title"
                  [dataLabels]="dataLabels"
                  [tooltip]="tooltip"
                  [grid]="grid"
                  [responsive]="responsive"
                />
              </div>
            </ion-card-content>
          </ion-card>
          
        </div>

        <div class="relatorio-div">
          <h2 class="relatorio-title">Sábado, 3 de Nov</h2>

          <ion-card>
            <ion-card-header>
              <ion-card-title>Relatório semanal</ion-card-title>
              <ion-card-subtitle>03/10/26 | 18:50</ion-card-subtitle>
            </ion-card-header>
          </ion-card>
          
        </div>
      </div>
      
    </div>
    <!-- Barra de navegação -->
    <app-bottom-nav [activePage]="'relatorios'"></app-bottom-nav>
  </div>
</ion-content>
