<app-header pageTitle="Estufas"></app-header>

<ion-content [fullscreen]="true">
  <div id="container" class="ion-padding">
    <!-- Seção Principal -->
    <div class="section-content">
      <div class="section-text">
        <ion-icon id="list" name="list"></ion-icon>
        <h2 class="section-title">Minhas estufas</h2>
      </div>
      
      <ion-list>
        <!-- Estufa 01 -->
        <ion-item-sliding>
          <ion-item>
            <ion-label>
              Estufa do quarto
              <ion-chip class="active">Ativa</ion-chip>
            </ion-label>
            <div class="description">
              <!-- <p class="status">
                Status:
                <ion-badge color="green">ativa</ion-badge>
                |
              </p> -->
              <p class="condition">
                <!-- Condição:
                <ion-badge color="green">ótima</ion-badge> -->
              </p>
              <div class="variables">
                <ion-badge class="ideal">Temp</ion-badge>
                <ion-badge class="ideal">Um Solo</ion-badge>
                <ion-badge class="no-ideal">Lum</ion-badge>
                <ion-badge class="ideal">Um Ar</ion-badge>
              </div>
            </div>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option>
              <ion-icon slot="icon-only" name="pencil"></ion-icon>
            </ion-item-option>
            <ion-item-option color="red">
              <ion-icon slot="icon-only" name="trash"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
        
        <!-- Estufa 02 -->
        <ion-item-sliding>
          <ion-item>
            <ion-label>
              Estufa da varanda
              <ion-chip>Desativada</ion-chip>
            </ion-label>
            <div class="description">
              <!-- <p class="status">
                Status:
                <ion-badge color="green">ativa</ion-badge>
                |
              </p> -->
              <p class="condition">
                <!-- Condição:
                <ion-badge color="green">ótima</ion-badge> -->
              </p>
              <div class="variables">
                <ion-badge>Temp</ion-badge>
                <ion-badge>Um Solo</ion-badge>
                <ion-badge>Lum</ion-badge>
                <ion-badge>Um Ar</ion-badge>
              </div>
            </div>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option>
              <ion-icon slot="icon-only" name="pencil"></ion-icon>
            </ion-item-option>
            <ion-item-option color="red">
              <ion-icon slot="icon-only" name="trash"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </ion-list>
      <!-- Adicionar estufa -->
      <ion-button id="open-modal" class="add-btn" shape="round" size="large">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>

      <ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
        <ng-template>
          <ion-header>
            <ion-toolbar>
              <ion-title>
              <ion-icon name="create"></ion-icon>
              Editar estufa
            </ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            <!-- <ion-item>
              <ion-input
                name="name"
                label="Enter your name"
                labelPlacement="stacked"
                type="text"
                placeholder="Your name"
                [(ngModel)]="name"
              ></ion-input>
            </ion-item> -->
            
            <ion-title>Propriedades</ion-title>
            <!-- Nome da estufa -->
            <ion-list>
              <ion-item>
                <ion-input 
                labelPlacement="floating" 
                label="Nome da estufa" 
                placeholder="Digite o nome"
                [counter]="true"
                maxlength="30"
                >
                  <ion-icon slot="start" name="bookmark" aria-hidden="true"></ion-icon>
                </ion-input>
              </ion-item>
            </ion-list>

            <!-- Status -->
            <ion-list>
              <ion-item>
                <ion-select labelPlacement="floating" label="Status" value="apple">
                  <ion-icon slot="start" name="pulse" aria-hidden="true"></ion-icon>
                  <ion-select-option value="active">Ativa</ion-select-option>
                  <ion-select-option value="noActive">Desativada</ion-select-option>
                </ion-select>
              </ion-item>
            </ion-list>
            
            <ion-title>Métricas</ion-title>
            <!-- Faixa de temperatura -->
            <ion-list>
              <ion-item>
                <ion-select labelPlacement="floating" label="Faixa de temperatura" value="apple">
                  <ion-icon slot="start" name="thermometer" aria-hidden="true"></ion-icon>
                  <ion-select-option value="active">Ativa</ion-select-option>
                  <ion-select-option value="noActive">Desativada</ion-select-option>
                </ion-select>
              </ion-item>
            </ion-list>

          </ion-content>
          <div class="ion-padding">
            <ion-buttons slot="start">
              <ion-button (click)="cancel()">Voltar</ion-button>
              <ion-button (click)="confirm()" [strong]="true">Salvar</ion-button>
            </ion-buttons>
          </div>
        </ng-template>
      </ion-modal>
    </div>
    <!-- Bottom-nav -->
    <app-bottom-nav [activePage]="'estufas'"></app-bottom-nav>
  </div>  
</ion-content>
